{% extends "base.html" %}
{% from '_macros.html' import csrf %}
{% block content %}
  <a class="back-link"
     href="{{ url_for('web.animal_detail',id=animal.id) }}">← {{ animal.name }}’s profile</a>
  <section class="form-card wide">
    <span class="eyebrow">STAFF MEDICAL RECORD</span>
    <h1>{{'Edit record' if record else 'Add a care record'}}.</h1>
    <p>
      Animal: <strong>{{ animal.name }}</strong>
    </p>
    <form method="post">{{ csrf() }}{% if record %}
      <input type="hidden" name="version" value="{{ record.version }}">
{% endif %}
<label>
  Record date<input class="form-control"
       type="date"
       name="record_date"
       value="{{ record.record_date if record else '' }}"
       required>
</label>
<label>
  Record type<input class="form-control"
       name="kind"
       value="{{ record.kind if record else '' }}"
       required
       maxlength="40"
       placeholder="Vaccination, examination, treatment…">
</label>
<label>
  Care notes<textarea class="form-control"
          name="notes"
          required
          maxlength="3000"
          rows="5">{{record.notes if record else ''}}</textarea>
</label>
<button class="btn btn-primary">Save medical record</button>
</form>
</section>
{% endblock %}
